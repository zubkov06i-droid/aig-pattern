# quarantine-notifier — карантин (бакет quarantine) и реестр тикетов с SLA
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quarantine-notifier
  namespace: aig
  labels: {app: quarantine-notifier}
spec:
  replicas: 1
  serviceName: quarantine-notifier
  selector: {matchLabels: {app: quarantine-notifier}}
  template:
    metadata:
      labels: {app: quarantine-notifier, tier: app}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8006"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: aig-quarantine-sa
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001,
                        seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: quarantine-notifier
        image: aig/quarantine:1.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8006, name: http}]
        envFrom: [{configMapRef: {name: aig-config}}]
        env:
        - {name: PORT, value: "8006"}
        - {name: S3_ACCESS_KEY, value: aig-quarantine-sa}
        - name: S3_SECRET_KEY
          valueFrom: {secretKeyRef: {name: aig-secrets, key: AIG_QUARANTINE_SA_SECRET}}
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
                          capabilities: {drop: [ALL]}}
        volumeMounts: [{name: tmp, mountPath: /tmp}, {name: data, mountPath: /data}]
      volumes: [{name: tmp, emptyDir: {}}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: quarantine-notifier, namespace: aig}
spec:
  selector: {app: quarantine-notifier}
  ports: [{name: http, port: 8006, targetPort: http}]
