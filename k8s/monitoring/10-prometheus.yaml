# Prometheus: сбор метрик микросервисов AIG, MinIO и cAdvisor, правила оповещения
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: aig-monitoring}
---
# только чтение: обнаружение подов и узлов, метрики cAdvisor через API-сервер
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: aig-prometheus}
rules:
- apiGroups: [""]
  resources: [pods, nodes, nodes/proxy, nodes/metrics]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: aig-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aig-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: aig-monitoring}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: aig-monitoring, labels: {app: prometheus}}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534,
                        seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        # 48 ч: эксперимент занимает один день, ещё сутки — на анализ и скриншоты
        - --storage.tsdb.retention.time=48h
        - --web.enable-lifecycle
        ports: [{containerPort: 9090, name: http}]
        readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 10}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 768Mi}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]},
                          readOnlyRootFilesystem: true}
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - {name: rules, mountPath: /etc/prometheus/rules}
        - {name: data, mountPath: /prometheus}
      volumes:
      - {name: config, configMap: {name: prometheus-config}}
      - {name: rules, configMap: {name: prometheus-rules}}
      - {name: data, emptyDir: {sizeLimit: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: aig-monitoring}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
