# Loki: хранилище журналов; promtail: агент сбора журналов подов с узла
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: aig-monitoring, labels: {app: loki}}
spec:
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001,
                        seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: loki
        image: grafana/loki:3.3.2
        args: [-config.file=/etc/loki/loki.yaml]
        ports: [{containerPort: 3100, name: http}]
        readinessProbe:
          httpGet: {path: /ready, port: http}
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]},
                          readOnlyRootFilesystem: true}
        volumeMounts:
        - {name: config, mountPath: /etc/loki}
        - {name: data, mountPath: /loki}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: config, configMap: {name: loki-config}}
      - {name: data, emptyDir: {sizeLimit: 2Gi}}
      - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: aig-monitoring}
spec:
  selector: {app: loki}
  ports: [{name: http, port: 3100, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: promtail, namespace: aig-monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: aig-promtail}
rules:
- apiGroups: [""]
  resources: [pods, nodes]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: aig-promtail}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aig-promtail}
subjects: [{kind: ServiceAccount, name: promtail, namespace: aig-monitoring}]
---
# DaemonSet: по агенту на узел; журналы читаются с узла только на чтение
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: promtail, namespace: aig-monitoring, labels: {app: promtail}}
spec:
  selector: {matchLabels: {app: promtail}}
  template:
    metadata: {labels: {app: promtail}}
    spec:
      serviceAccountName: promtail
      containers:
      - name: promtail
        image: grafana/promtail:3.3.2
        args: [-config.file=/etc/promtail/promtail.yaml, -config.expand-env=true]
        env:
        - name: HOSTNAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        ports: [{containerPort: 9080, name: http}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
        volumeMounts:
        - {name: config, mountPath: /etc/promtail}
        - {name: run, mountPath: /run/promtail}
        - {name: tmp, mountPath: /tmp}
        - {name: pods, mountPath: /var/log/pods, readOnly: true}
        - {name: containers, mountPath: /var/lib/docker/containers, readOnly: true}
      volumes:
      - {name: config, configMap: {name: promtail-config}}
      - {name: run, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
      - {name: pods, hostPath: {path: /var/log/pods}}
      - {name: containers, hostPath: {path: /var/lib/docker/containers}}
