# Контур мониторинга паттерна AIG: kubectl apply -k k8s/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 10-prometheus.yaml
  - 20-loki.yaml
  - 30-grafana.yaml
generatorOptions:
  disableNameSuffixHash: false
configMapGenerator:
  - name: prometheus-config
    namespace: aig-monitoring
    files: [config/prometheus.yml]
  - name: prometheus-rules
    namespace: aig-monitoring
    files: [config/aig-security.rules.yml]
  - name: loki-config
    namespace: aig-monitoring
    files: [config/loki.yaml]
  - name: promtail-config
    namespace: aig-monitoring
    files: [config/promtail.yaml]
  - name: grafana-datasources
    namespace: aig-monitoring
    files: [config/grafana-datasources.yaml]
  - name: grafana-dashboard-providers
    namespace: aig-monitoring
    files: [config/grafana-dashboard-providers.yaml]
  - name: grafana-dashboards
    namespace: aig-monitoring
    files: [dashboards/aig-security.json]
