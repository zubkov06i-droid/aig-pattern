# Пространство имён контура мониторинга (глава 4). Его метка kubernetes.io/metadata.name
# указана в политике allow-monitoring-scrape пространства aig: только отсюда разрешён
# опрос метрик микросервисов. Уровень privileged нужен одному поду — агенту promtail,
# который читает журналы контейнеров с узла (hostPath); для остальных подов
# выдаются предупреждения уровня restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: aig-monitoring
  labels:
    app.kubernetes.io/part-of: aig-pattern
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
