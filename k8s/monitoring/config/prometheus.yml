# Prometheus: сбор метрик паттерна AIG (pull-модель)
global:
  # 15 с: окно правил [5m] содержит 20 отсчётов, а функция rate() по окну [1m]
  # получает 4 отсчёта (нужно не меньше 2) — дашборд реагирует на атаку за минуту
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {stand: aig-vm3}

rule_files: [/etc/prometheus/rules/*.yml]

scrape_configs:
  # микросервисы и MinIO: поды пространства aig с аннотацией prometheus.io/scrape
  - job_name: aig-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [aig]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels:
          - __meta_kubernetes_pod_ip
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        regex: (.+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

  # ресурсы контейнеров (CPU, память) — cAdvisor kubelet через API-сервер
  - job_name: kubelet-cadvisor
    scheme: https
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: aig|aig-monitoring
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
