# schema-registry — реестр схем, одна реплика (leader-write), SQLite на томе RWO
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: schema-registry, namespace: aig, labels: {app: schema-registry}}
spec:
  replicas: 1
  serviceName: schema-registry
  selector: {matchLabels: {app: schema-registry}}
  template:
    metadata:
      labels: {app: schema-registry, tier: app}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: aig-registry-sa
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001,
                        seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: schema-registry
        image: aig/registry:1.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8004, name: http}]
        envFrom: [{configMapRef: {name: aig-config}}]
        env:
        - {name: PORT, value: "8004"}
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
                          capabilities: {drop: [ALL]}}
        volumeMounts: [{name: tmp, mountPath: /tmp}, {name: data, mountPath: /data}]
      volumes: [{name: tmp, emptyDir: {}}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: schema-registry, namespace: aig}
spec:
  selector: {app: schema-registry}
  ports: [{name: http, port: 8004, targetPort: http}]
