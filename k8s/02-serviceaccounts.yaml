# Отдельная учётная запись на каждый микросервис; токен API Kubernetes
# не монтируется — сервисам паттерна API кластера не нужен (least privilege).
apiVersion: v1
kind: ServiceAccount
metadata: {name: aig-gateway-sa, namespace: aig}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: aig-ingest-sa, namespace: aig}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: aig-security-sa, namespace: aig}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: aig-detector-sa, namespace: aig}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: aig-registry-sa, namespace: aig}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: aig-adapter-sa, namespace: aig}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: aig-quarantine-sa, namespace: aig}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: aig-storage-sa, namespace: aig}
automountServiceAccountToken: false
