# adapter-factory — вывод схемы и конвертеры; реестр конвертеров в SQLite на томе RWO
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: adapter-factory, namespace: aig, labels: {app: adapter-factory}}
spec:
  replicas: 1
  serviceName: adapter-factory
  selector: {matchLabels: {app: adapter-factory}}
  template:
    metadata:
      labels: {app: adapter-factory, tier: app}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: aig-adapter-sa
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001,
                        seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: adapter-factory
        image: aig/adapter:1.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8005, name: http}]
        envFrom: [{configMapRef: {name: aig-config}}]
        env:
        - {name: PORT, value: "8005"}
        - {name: S3_ACCESS_KEY, value: aig-adapter-sa}
        - name: S3_SECRET_KEY
          valueFrom: {secretKeyRef: {name: aig-secrets, key: AIG_ADAPTER_SA_SECRET}}
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
                          capabilities: {drop: [ALL]}}
        volumeMounts: [{name: tmp, mountPath: /tmp}, {name: data, mountPath: /data}]
      volumes: [{name: tmp, emptyDir: {}}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: adapter-factory, namespace: aig}
spec:
  selector: {app: adapter-factory}
  ports: [{name: http, port: 8005, targetPort: http}]
