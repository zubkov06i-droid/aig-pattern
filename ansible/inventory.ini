# Стенд из трёх ВМ VirtualBox, сеть host-only 192.168.56.0/24 (по умолчанию)
# ВМ3 — кластер Kubernetes с паттерном AIG
# ВМ2 — легальный пользователь, ВМ1 — нарушитель
[aig_cluster]
vm3-cluster  ansible_host=192.168.56.13

[aig_clients]
vm2-user     ansible_host=192.168.56.12  aig_role=user
vm1-intruder ansible_host=192.168.56.11  aig_role=intruder

[all:vars]
ansible_user=aig
ansible_python_interpreter=/usr/bin/python3
