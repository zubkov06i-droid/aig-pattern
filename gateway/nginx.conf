# gateway — единственная точка входа паттерна AIG (nginx-unprivileged, порт 8080)
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;
    server_tokens off;
    log_format json escape=json
        '{"ts":"$time_iso8601","service":"gateway","ip":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$request_length,"rt":$request_time}';

    access_log /dev/stdout json;

    # внешний эшелон ограничения частоты: по IP и по токену (JWT-субъекту)
    limit_req_zone $binary_remote_addr  zone=per_ip:10m    rate=5r/s;
    limit_req_zone $http_authorization  zone=per_token:10m rate=2r/s;
    limit_req_status 429;
    client_max_body_size 64m;              # = MAX_OBJECT_BYTES security-service

    upstream ingest_api { server ingest-api:8001; }

    server {
        listen 8080;
        location ~ ^/(ingest|ingest-mpu|tickets)/ {
            limit_req zone=per_ip    burst=20 nodelay;
            limit_req zone=per_token burst=31 nodelay;
            proxy_pass http://ingest_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        location = /healthz { access_log off; return 200 "ok\n"; }
        # прямой доступ к S3 API и сервисам закрыт
        location / { return 404; }
    }
}
